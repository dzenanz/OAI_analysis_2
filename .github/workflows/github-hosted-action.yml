name: cpu-test

on: [push, pull_request]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python 3.11
      uses: actions/setup-python@v7
      with:
        python-version: 3.11
        cache: pip
    - name: Install dependencies
      run: |
        pip install torch --index-url https://download.pytorch.org/whl/cpu
        pip install -e ".[dev]"
        # separate packages in ITK 5.x, built into ITK 6, so not in the dependencies
        pip install itk-cuberille itk-parabolicmorphology
    - name: Cache network weights and test data
      uses: actions/cache@v6
      with:
        path: ~/.cache/oai-analysis
        key: oai-analysis-data-${{ hashFiles('oai_analysis/data.py') }}
    - name: Test with pytest
      run: |
        pytest --durations=10
