[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "oai-analysis"
dynamic = ["version"]
description = 'Image analysis for the Osteoarthritis Initiative (OAI) knee magnetic resonance image (MRI) dataset.'
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
keywords = []
authors = [
  { name = "Marc Niethammer", email = "mn@cs.unc.edu" },
  { name = "Hastings Greer", email = "hastings.greer@gmail.com" },
  { name = "Matt McCormick", email = "matt@mmmccormick.com" },
  { name = "Pranjal Sahu", email = "pranjalsahu5@gmail.com" },
  { name = "Dženan Zukić", email = "dzenan.zukic@kitware.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: Implementation :: CPython",
]
# Lower bounds are the versions the regression baseline was produced with; upper bounds exclude the next major version.
# For CUDA, install torch from https://pytorch.org/get-started/locally/ first.
dependencies = [
  "torch>=2.6",
  "itk>=5.4.7,<6",
  "itk-cuberille>=2.7.2,<3",
  "itk-parabolicmorphology>=1.3.1,<2",
  "trimesh>=5.1,<6",
  "vtk>=9.7.1,<10",
  "icon_registration>=1.1.8,<2",
  "unigradicon>=1.0.5,<2",
  "pooch>=1.9,<2",
  "numpy>=2.2,<3",
  "scipy>=1.14,<2",
  "matplotlib>=3.9,<4",
  "scikit-image>=0.26,<1",
  "scikit-learn>=1.9.1,<2",
  "pyyaml>=6,<7",
  "pyarrow>=17",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "coverage[toml]>=6.5",
]

[project.scripts]
oai-analysis = "oai_analysis.cli:main"

[project.urls]
Documentation = "https://github.com/uncbiag/OAI_analysis_2#readme"
Issues = "https://github.com/uncbiag/OAI_analysis_2/issues"
Source = "https://github.com/uncbiag/OAI_analysis_2"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["oai_analysis"]

[tool.hatch.build.targets.sdist]
include = ["oai_analysis", "test", "tools", "README.md", "LICENSE"]

[tool.hatch.envs.default]
features = ["dev"]
[tool.hatch.envs.default.scripts]
test = "pytest {args:test}"
test-cov = "coverage run -m pytest {args:test}"
cov-report = [
  "- coverage combine",
  "coverage report",
]
cov = [
  "test-cov",
  "cov-report",
]

[[tool.hatch.envs.all.matrix]]
python = ["3.11", "3.12", "3.13"]

[tool.hatch.envs.lint]
detached = true
dependencies = [
  "black>=23.1.0",
  "mypy>=1.0.0",
  "ruff>=0.0.243",
]
[tool.hatch.envs.lint.scripts]
typing = "mypy --install-types --non-interactive {args:oai_analysis test}"
style = [
  "ruff {args:.}",
  "black --check --diff {args:.}",
]
fmt = [
  "black {args:.}",
  "ruff --fix {args:.}",
  "style",
]
all = [
  "style",
  "typing",
]

[tool.black]
target-version = ["py311"]
line-length = 120
skip-string-normalization = true

[tool.ruff]
target-version = "py311"
line-length = 120
select = [
  "A",
  "ARG",
  "B",
  "C",
  "DTZ",
  "E",
  "EM",
  "F",
  "FBT",
  "I",
  "ICN",
  "ISC",
  "N",
  "PLC",
  "PLE",
  "PLR",
  "PLW",
  "Q",
  "RUF",
  "S",
  "T",
  "TID",
  "UP",
  "W",
  "YTT",
]
ignore = [
  # Allow non-abstract empty methods in abstract base classes
  "B027",
  # Allow boolean positional values in function calls, like `dict.get(... True)`
  "FBT003",
  # Ignore checks for possible passwords
  "S105", "S106", "S107",
  # Ignore complexity
  "C901", "PLR0911", "PLR0912", "PLR0913", "PLR0915",
]
unfixable = [
  # Don't touch unused imports
  "F401",
]

[tool.ruff.isort]
known-first-party = ["oai_analysis"]

[tool.ruff.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.per-file-ignores]
# Tests can use magic values, assertions, and relative imports
"test/**/*" = ["PLR2004", "S101", "TID252"]

[tool.coverage.run]
source_pkgs = ["oai_analysis", "test"]
branch = true
parallel = true

[tool.coverage.paths]
oai_analysis = ["oai_analysis", "*/oai-analysis/oai_analysis"]
tests = ["test", "*/oai-analysis/test"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

[tool.pytest.ini_options]
testpaths = ["test"]
